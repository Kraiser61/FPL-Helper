name: FPL Strategy Solver & Exporter

on:
  workflow_dispatch: # Manuel tetikleme (Telefondan, Web'den veya API'den)
    inputs:
      team_data:
        description: 'Raw FPL my-team JSON or Telegram command'
        required: false
        default: ''
  repository_dispatch: # Google Apps Script / Telegram Webhook tetiklemesi
    types: [telegram-trigger, solve, analyze]

permissions:
  contents: write

jobs:
  run-solver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-headless.txt
          python -m playwright install --with-deps chromium

      - name: Run FPL Strategy Solver & Generate JSON
        env:
          FPL_EMAIL: ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD: ${{ secrets.FPL_PASSWORD }}
          FPL_AUTH_TOKEN: ${{ secrets.FPL_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RAW_TEAM_DATA: ${{ github.event.inputs.team_data || github.event.client_payload.team_data }}
        run: |
          python export_fpl_analysis.py

      - name: Commit and Push Analysis Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fpl_analysis.json data/fplreview.csv data/synced_team.json
          if git diff --staged --quiet; then
            echo "Verilerde değişiklik yok. Commit atlanıyor."
          else
            git commit -m "Auto: Update FPL Strategy Analysis & Hybrid FPLReview CSV [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
